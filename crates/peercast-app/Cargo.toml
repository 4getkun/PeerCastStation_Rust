[package]
name = "peercast-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
peercast-core = { path = "../peercast-core" }
peercast-pcp = { path = "../peercast-pcp" }
peercast-format = { path = "../peercast-format" }
peercast-http = { path = "../peercast-http" }
peercast-rpc = { path = "../peercast-rpc" }
bytes.workspace = true
thiserror.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread", "signal", "time", "net", "io-util"] }
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1.29.0", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
igd-next = { version = "0.18", default-features = false, features = ["aio_tokio"] }
xmltree = "0.10.3"
