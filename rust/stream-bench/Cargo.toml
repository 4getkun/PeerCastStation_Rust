[package]
name = "peercast-stream-bench"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
peercast-core = { path = "../../crates/peercast-core" }
peercast-http = { path = "../../crates/peercast-http" }
peercast-format = { path = "../../crates/peercast-format" }
bytes = "1.10"
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt", "macros", "sync", "time", "io-util"] }
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
[profile.win11-x64]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
